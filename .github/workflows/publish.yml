name: publish

on:
  push:
    branches: [main]
    paths:
      - "blog/src/**"
      - "blog/img/**"
      - "blog/blog.css"
      - "tools/build_blog.py"
  pull_request:
    paths:
      - "blog/src/**"

# Primary path: the cloud routine (or Om) pushes a post with draft: false straight to main. Any plain
# git push by a human or a PAT triggers this; only pushes made with GITHUB_TOKEN or commits whose
# message contains "[skip ci]" do not, which is exactly what stops the commit-back below from looping.
permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_blog.py reads git dates for sitemap lastmod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python tools/build_blog.py
      - name: Commit generated files
        # The "[skip ci]" marker plus the GITHUB_TOKEN push both stop this run from re-triggering itself.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'blog/**/index.html' blog/index.html sitemap.xml feed.xml llms.txt robots.txt
          git diff --cached --quiet && echo "nothing to commit" || { git commit -m "ci: build blog [skip ci]" && git push; }
      - run: python tools/indexnow.py --sitemap

  qa: # extra gate for anyone who still opens a PR; the routine runs qa_post.py itself before pushing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: QA changed posts
        run: |
          files=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- 'blog/src/*.md')
          [ -z "$files" ] && { echo "no post changes"; exit 0; }
          python tools/qa_post.py $files
