<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work with MealSaid</title>
<meta name="description" content="Paid creator collabs for a calorie app you talk to. Drop your details and we will keep working together.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080b12">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional">
<style>
:root{
  --bg:#080b12;
  --bg-2:#0c1119;
  --ink:#f3f5f8;
  --ink-2:#aeb6c4;
  --ink-3:#6f7889;
  --line:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.035);
  --acc:#d6ff3d;
  --acc-ink:#0b0f05;
  --pw:clamp(240px,26vw,330px);
  --r:calc(var(--pw) * .13);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font);
  letter-spacing:-.005em;font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 620px at 18% -8%,rgba(52,96,214,.38),transparent 62%),
    radial-gradient(760px 520px at 90% 8%,rgba(32,58,140,.26),transparent 60%),
    linear-gradient(180deg,#0a1020 0%,var(--bg) 42%,var(--bg) 100%);
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
::selection{background:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:4px}

.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
@media (max-width:640px){.wrap{width:calc(100% - 32px)}}

/* ---------- nav ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0 0}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand img{width:30px;height:30px;border-radius:8px}
.nav a.ghost{font-size:14px;color:var(--ink-2);border:1px solid var(--line);padding:9px 14px;border-radius:999px;transition:border-color .25s,color .25s}
.nav a.ghost:hover{border-color:rgba(255,255,255,.22);color:var(--ink)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:clamp(32px,5vw,72px);padding:clamp(56px,9vw,120px) 0 clamp(48px,7vw,96px)}
.hero h1{font-size:clamp(42px,6.2vw,84px);line-height:.98;letter-spacing:-.035em;font-weight:700;text-wrap:balance;max-width:11ch}
.hero .sub{margin-top:clamp(18px,2.4vw,28px);font-size:clamp(19px,2vw,24px);color:var(--ink-2);letter-spacing:-.012em;line-height:1.35}
.acc{color:var(--acc)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(28px,3.4vw,42px);align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;letter-spacing:-.01em;transition:transform .35s var(--ease),background .25s,border-color .25s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:#e3ff6b}
.btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.secondary:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.09)}
.btn svg{flex:none}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:rgba(255,255,255,.08);padding:4px 7px;border-radius:5px;margin-left:2px}
.hero .fine{margin-top:16px;font-size:13.5px;color:var(--ink-3)}
.hero .fine a{color:var(--ink-2);border-bottom:1px solid var(--line)}
.hero .stage{justify-self:center}

/* ---------- phone ---------- */
.phone{
  width:var(--pw);padding:7px;border-radius:calc(var(--r) + 7px);
  background:linear-gradient(160deg,#1d2230,#0b0e15);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.6) inset;
  position:relative;
}
.phone img{width:100%;aspect-ratio:1320/2868;border-radius:var(--r);background:#000}
.phone::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.08) 0%,transparent 35%,transparent 70%,rgba(255,255,255,.04) 100%)}

/* ---------- features ---------- */
.features{display:grid;gap:clamp(56px,9vw,128px);padding:clamp(24px,5vw,64px) 0}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(28px,5vw,72px)}
.feat:nth-child(even) .copy{order:2}
.feat .copy{max-width:44ch}
.kicker{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
.kicker b{color:var(--acc);font-weight:600}
.kicker::after{content:"";height:1px;width:34px;background:var(--line)}
.feat h2{font-size:clamp(30px,3.9vw,50px);line-height:1.04;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
.feat .lede{margin-top:14px;font-size:clamp(18px,1.6vw,21px);color:var(--ink);letter-spacing:-.012em;line-height:1.35}
.feat p.body{margin-top:14px;color:var(--ink-2);font-size:16.5px;max-width:40ch}
.stage{
  justify-self:center;display:grid;place-items:center;
  width:100%;max-width:520px;aspect-ratio:1/1.08;border-radius:28px;
  background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  position:relative;overflow:hidden;
}
.stage::before{content:"";position:absolute;inset:-40%;pointer-events:none;
  background:radial-gradient(closest-side at 50% 42%,rgba(63,110,230,.22),transparent 70%)}
.stage .phone{transform:translateY(8%)}
.stage.top .phone{transform:translateY(-6%)}
.stage.call::before{background:radial-gradient(closest-side at 50% 50%,rgba(214,255,61,.10),transparent 70%)}
.stage .phone{position:relative}
.hero .stage::before{display:none}

/* transcript */
.said{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:12px 16px 12px 14px;border-radius:14px;background:rgba(214,255,61,.08);border:1px solid rgba(214,255,61,.18);color:var(--ink);font-size:17px;letter-spacing:-.01em}
.said q{quotes:"\201C" "\201D"}
.wave{display:inline-flex;align-items:center;gap:2.5px;height:16px}
.wave i{width:2.5px;height:30%;background:var(--acc);border-radius:2px;animation:wave 1.1s var(--ease) infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wave{0%,100%{height:28%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;height:60%}.wave i:nth-child(odd){height:35%}}

/* ---------- privacy strip ---------- */
.priv{margin-top:clamp(56px,9vw,128px);padding:clamp(28px,4vw,48px) clamp(22px,3.5vw,44px);border-radius:28px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:clamp(24px,4vw,56px);align-items:start}
.priv h2{font-size:clamp(28px,3.2vw,40px);line-height:1.05;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
.priv .more{display:inline-block;margin-top:18px;font-size:15px;color:var(--ink-2);border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:1px}
.priv .more:hover{color:var(--ink);border-color:var(--acc)}
.priv ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:22px 32px}
.priv li{padding-top:14px;border-top:1px solid var(--line)}
.priv li strong{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em;margin-bottom:4px}
.priv li span{color:var(--ink-2);font-size:15px;line-height:1.45;display:block}

/* ---------- faq ---------- */
.faq{padding:clamp(64px,9vw,128px) 0 0;display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(24px,4vw,64px)}
.faq h2{font-size:clamp(28px,3.2vw,40px);line-height:1.05;letter-spacing:-.03em;font-weight:700}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;font-weight:600;font-size:18px;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:12px;height:12px;flex:none;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:rotate(45deg) translateY(-3px);transition:transform .35s var(--ease)}
.faq details[open] summary::after{transform:rotate(225deg) translateY(-1px)}
.faq details[open] summary{color:var(--acc)}
.faq .a{padding:0 0 22px;color:var(--ink-2);max-width:56ch}
.faq .a a{color:var(--ink);border-bottom:1px solid rgba(255,255,255,.2)}

/* ---------- final cta ---------- */
.end{text-align:left;padding:clamp(72px,10vw,140px) 0 clamp(40px,6vw,72px);display:grid;gap:22px;justify-items:start}
.end h2{font-size:clamp(36px,5vw,64px);line-height:1;letter-spacing:-.035em;font-weight:700;max-width:14ch;text-wrap:balance}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:26px 0 calc(28px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-3)}
footer nav{display:flex;gap:22px;flex-wrap:wrap}
footer a{color:var(--ink-2)}
footer a:hover{color:var(--ink)}

/* ---------- reveal ---------- */
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.js .rv.d1{transition-delay:.08s}.js .rv.d2{transition-delay:.16s}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}}

/* ---------- responsive ---------- */
@media (max-width:900px){
  :root{--pw:clamp(230px,56vw,300px)}
  .hero{grid-template-columns:1fr;padding-top:48px;gap:44px}
  .hero h1{max-width:none}
  .hero .stage{justify-self:start}
  .feat{grid-template-columns:1fr;gap:28px}
  .feat:nth-child(even) .copy{order:0}
  .stage{max-width:none;aspect-ratio:auto;padding:26px 0 0;border-radius:24px}
  .stage .phone,.stage.top .phone{transform:none}
  .stage{height:calc(var(--pw) * 1.72);align-items:start}
  .stage .phone{margin-top:0}
  .priv,.faq{grid-template-columns:1fr}
  .priv ul{grid-template-columns:1fr}
}
@media (max-width:480px){
  .nav a.ghost{display:none}
  .btn{height:50px;padding:0 18px;font-size:15px}
  .cta{flex-direction:column;align-items:stretch}
  .cta .btn{justify-content:center}
}
</style>
<style>
.cform{margin:clamp(40px,7vw,88px) auto clamp(48px,7vw,96px);max-width:620px}
.cform h1{font-size:clamp(38px,5.6vw,68px);line-height:1;letter-spacing:-.035em;font-weight:700;text-wrap:balance}
.cform .sub{margin-top:16px;font-size:clamp(18px,1.9vw,22px);color:var(--ink-2);letter-spacing:-.012em;line-height:1.35}
.card{margin-top:34px;padding:clamp(22px,3.5vw,36px);border-radius:28px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;gap:18px}
.card label{display:grid;gap:7px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.card input,.card textarea{font:400 16px/1.4 var(--font);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;transition:border-color .25s}
.card input:focus,.card textarea:focus{outline:none;border-color:var(--acc)}
.card textarea{min-height:96px;resize:vertical}
.card .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card .opt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)}
.card .btn{justify-content:center;border:0;cursor:pointer;margin-top:4px}
.card .btn[disabled]{opacity:.6;cursor:default}
.card .err{color:#ff8c8c;font-size:14px;display:none}
.thanks{display:none;margin-top:34px;padding:clamp(28px,4vw,48px);border-radius:28px;background:rgba(214,255,61,.08);border:1px solid rgba(214,255,61,.18)}
.thanks h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.03em;line-height:1.05}
.thanks p{margin-top:12px;color:var(--ink-2)}
@media (max-width:560px){.card .row{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="wrap">
  <div class="nav">
    <a class="brand" href="./" aria-label="MealSaid home"><img src="assets/icon-192.png" width="30" height="30" alt="">MealSaid</a>
    <a class="ghost" href="https://testflight.apple.com/join/s6U7TMe1">Join the beta</a>
  </div>
</header>

<main class="wrap">
  <section class="cform" aria-labelledby="h1">
    <h1 id="h1">Work with <span class="acc">MealSaid</span></h1>
    <p class="sub">Paid creator collabs for a calorie app you talk to.</p>

    <form class="card" id="f" novalidate>
      <div class="row">
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
      </div>
      <div class="row">
        <label>Instagram<input name="instagram" placeholder="@handle"></label>
        <label>TikTok<input name="tiktok" placeholder="@handle"></label>
      </div>
      <div class="row">
        <label>YouTube <span class="opt">(optional)</span><input name="youtube" placeholder="channel link or handle"></label>
        <label>Country<input name="country" autocomplete="country-name"></label>
      </div>
      <label>PayPal email or UPI<input name="paypal_or_upi"></label>
      <label>Anything we should know<textarea name="notes" placeholder="Your niche, rates, ideas, anything"></textarea></label>
      <input type="hidden" name="source" value="site">
      <p class="err" id="err"></p>
      <button class="btn primary" type="submit" id="go">Send my details</button>
    </form>

    <div class="thanks" id="thanks">
      <h2>Thanks, you are in.</h2>
      <p>We will reach out from om@turgon.ai about the next collab. Meanwhile, tag <strong>#mealsaid</strong> on anything you post.</p>
    </div>
  </section>
</main>

<footer class="wrap">
  <span>© 2026 Turgon</span>
  <nav aria-label="Footer">
    <a href="privacy.html">Privacy</a>
    <a href="support.html">Support</a>
    <a href="mailto:om@turgon.ai">om@turgon.ai</a>
  </nav>
</footer>

<script>
(function(){
  var f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
  var src=new URLSearchParams(location.search).get('src'); if(src) f.source.value=src;
  f.addEventListener('submit',function(e){
    e.preventDefault(); err.style.display='none';
    if(!f.name.value.trim()||!/.+@.+\..+/.test(f.email.value)){err.textContent='Please add your name and a valid email.';err.style.display='block';return}
    go.disabled=true; go.textContent='Sending…';
    fetch('https://voicefit-api.fly.dev/creators',{method:'POST',body:new URLSearchParams(new FormData(f))})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);})})
      .then(function(){f.style.display='none';document.getElementById('thanks').style.display='block'})
      .catch(function(x){err.textContent='Could not send ('+x.message+'). Email om@turgon.ai instead.';err.style.display='block';go.disabled=false;go.textContent='Send my details'});
  });
})();
</script>
</body>
</html>
